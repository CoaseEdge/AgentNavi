name: 物化 AgentNavi 0.2 实现

on:
  push:
    branches:
      - agent/l3-replay-benchmark-semantic-overlay

permissions:
  contents: write

concurrency:
  group: agentnavi-materialize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: contains(github.event.head_commit.message, 'bootstrap durable replay implementation')
    runs-on: ubuntu-latest
    steps:
      - name: 检出引导提交
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 校验并解包实现
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .agentnavi-bootstrap/part-00 \
            .agentnavi-bootstrap/part-01 \
            .agentnavi-bootstrap/part-02 \
            .agentnavi-bootstrap/part-03 \
            .agentnavi-bootstrap/part-040 \
            .agentnavi-bootstrap/part-041 \
            .agentnavi-bootstrap/part-042 \
            .agentnavi-bootstrap/part-05 \
            .agentnavi-bootstrap/part-06 \
            .agentnavi-bootstrap/part-07 \
            | base64 --decode > /tmp/agentnavi-bootstrap.tar.gz
          echo "feaf72e5430c4f84b1b60f49ea482cd6c50d90909346635800f493781293f563  /tmp/agentnavi-bootstrap.tar.gz" | sha256sum -c -
          tar -xzf /tmp/agentnavi-bootstrap.tar.gz

      - name: 修正长任务对短概念的反向包含检索
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("src/agentnavi/query.py")
          text = path.read_text(encoding="utf-8")
          start = text.index("def search_nodes(")
          end = text.index("\n\ndef search_tasks(", start)
          replacement = '''def search_nodes(
              connection: sqlite3.Connection,
              *,
              project_id: str,
              query: str,
              limit: int = 30,
          ) -> list[sqlite3.Row]:
              terms = search_terms(query)
              if not terms:
                  return list(
                      connection.execute(
                          """
                          SELECT * FROM nodes
                          WHERE project_id=? AND NOT (layer=2 AND kind='concept' AND data_json LIKE '%\"active\":false%')
                          ORDER BY layer DESC, updated_at DESC LIMIT ?
                          """,
                          (project_id, limit),
                      )
                  )

              candidates: dict[str, sqlite3.Row] = {}
              for term in terms:
                  pattern = f"%{term}%"
                  for row in connection.execute(
                      """
                      SELECT * FROM nodes
                      WHERE project_id=? AND (
                          lower(label) LIKE ? OR lower(key) LIKE ? OR lower(data_json) LIKE ?
                      )
                      LIMIT 200
                      """,
                      (project_id, pattern, pattern, pattern),
                  ):
                      candidates[row["id"]] = row

              # 长任务描述经常只保留较长 n-gram，例如“修改会员升级和支付逻辑”。
              # 此时短概念“会员升级”不会满足 query-term-in-label，但它本身明显包含于原任务。
              # 对活跃概念做一次有界的反向包含检查，并同时检查别名和关键词，
              # 可以恢复这类高价值命中，而不会把所有文件重新塞回候选集。
              full_query = " ".join(query.lower().split())
              if full_query:
                  for row in connection.execute(
                      """
                      SELECT * FROM nodes
                      WHERE project_id=? AND layer=2 AND kind='concept'
                        AND data_json NOT LIKE '%\"active\":false%'
                      LIMIT 5000
                      """,
                      (project_id,),
                  ):
                      data = json_loads(row["data_json"], {})
                      values = [str(row["label"]), str(row["key"])]
                      for field in ("aliases", "keywords", "headings", "link_labels", "symbols"):
                          field_values = data.get(field, [])
                          if isinstance(field_values, list):
                              values.extend(str(value) for value in field_values)
                      if any(
                          len(value.strip()) >= 2 and value.strip().lower() in full_query
                          for value in values
                      ):
                          candidates[row["id"]] = row

              ranked = sorted(
                  candidates.values(),
                  key=lambda row: (-_node_score(row, terms, full_query), row["label"]),
              )
              return ranked[:limit]
          '''
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY
          rm -rf .agentnavi-bootstrap
          rm -f .github/workflows/materialize-agentnavi.yml

      - name: 安装并验证
        shell: bash
        env:
          AGENTNAVI_HOME: ${{ runner.temp }}/agentnavi-home
        run: |
          set -euo pipefail
          python -m pip install -e .
          python -m compileall -q src
          python -m unittest discover -s tests -v
          agentnavi init
          agentnavi doctor

      - name: 提交实际实现
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "没有需要提交的变化。"
            exit 0
          fi
          git commit -m "feat: add durable replay, benchmarks, and semantic overlays"
          git push origin HEAD:${GITHUB_REF_NAME}
