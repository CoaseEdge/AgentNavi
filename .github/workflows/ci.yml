name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装项目
        run: python -m pip install -e .

      - name: 编译检查
        run: python -m compileall -q src

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: CLI 冒烟测试
        env:
          AGENTNAVI_HOME: ${{ runner.temp }}/agentnavi-home
        run: |
          agentnavi init
          agentnavi doctor

  deepseek-harness-integration:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: JavaScript 语法检查
        working-directory: integrations/deepseek-harness
        run: npm run check

      - name: 运行协议与事件顺序测试
        working-directory: integrations/deepseek-harness
        run: npm test
