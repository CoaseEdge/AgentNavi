name: 持续集成

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装项目
        run: python -m pip install -e .

      - name: 编译检查
        run: python -m compileall -q src

      - name: 运行测试
        run: python -m unittest discover -s tests -v

      - name: CLI 冒烟测试
        env:
          AGENTNAVI_HOME: ${{ runner.temp }}/agentnavi-home
        run: |
          agentnavi init
          agentnavi doctor

  mcp-contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: minimum-2.0.0
            install_mode: minimum
          - sdk: supported-range
            install_mode: extra

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装 MCP 最低支持版本
        if: matrix.install_mode == 'minimum'
        run: python -m pip install -e . 'mcp==2.0.0'

      - name: 从 optional extra 解析 MCP 支持范围
        if: matrix.install_mode == 'extra'
        run: python -m pip install -e '.[mcp]'

      - name: 检查依赖一致性
        run: python -m pip check

      - name: 运行 MCP 合同测试
        run: |
          python -m unittest tests.contract.test_mcp_server -v
          python -m unittest tests.contract.test_mcp_context_tool -v
          python -m unittest tests.commands.test_mcp_cli tests.unit.test_project_resolver -v
          python -m unittest tests.mcp.test_app_resource -v

  mcp-app-ui:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: 安装 UI 依赖
        run: npm ci --prefix ui

      - name: 类型与安全检查
        run: npm run check --prefix ui

      - name: 运行 UI 单元测试
        run: npm test --prefix ui

      - name: 构建单文件 MCP App
        run: npm run build --prefix ui

      - name: 检查生成资源无漂移
        run: npm run check:generated --prefix ui

  deepseek-harness-integration:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: JavaScript 语法检查
        working-directory: integrations/deepseek-harness
        run: npm run check

      - name: 运行协议与事件顺序测试
        working-directory: integrations/deepseek-harness
        run: npm test
