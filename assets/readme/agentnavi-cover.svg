<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">AgentNavi — Project Context Navigation Engine</title>
  <desc id="desc">让 AI Agent 先看懂项目，再开始工作。以 L1 物理图、L2 语义图和 L3 任务图为核心的项目上下文导航引擎。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06111f"/>
      <stop offset="55%" stop-color="#0a1c2d"/>
      <stop offset="100%" stop-color="#102a3b"/>
    </linearGradient>
    <radialGradient id="glow" cx="76%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#33d7e7" stop-opacity=".20"/>
      <stop offset="58%" stop-color="#4f7cff" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#43e2d3"/>
      <stop offset="100%" stop-color="#70a1ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#17384a" stop-opacity=".88"/>
      <stop offset="100%" stop-color="#10283b" stop-opacity=".72"/>
    </linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#8fd8e7" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020914" flood-opacity=".34"/>
    </filter>
    <clipPath id="frame">
      <rect x="0" y="0" width="1600" height="640" rx="32"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1600" height="640" fill="url(#bg)"/>
    <rect width="1600" height="640" fill="url(#grid)"/>
    <rect width="1600" height="640" fill="url(#glow)"/>

    <circle cx="1530" cy="65" r="250" fill="#4d78ff" opacity=".045"/>
    <circle cx="1320" cy="610" r="300" fill="#39d4d7" opacity=".035"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      <g transform="translate(92 76)">
        <rect x="0" y="0" width="432" height="38" rx="19" fill="#112d40" stroke="#54d9e3" stroke-opacity=".34"/>
        <circle cx="22" cy="19" r="5" fill="#4de3d4" filter="url(#softGlow)"/>
        <text x="39" y="25" fill="#9ddce4" font-size="14" font-weight="700" letter-spacing="2.3">PROJECT CONTEXT · MEMORY · ROUTING</text>

        <text x="0" y="150" fill="#f5fbff" font-size="104" font-weight="760" letter-spacing="-4">AgentNavi</text>
        <rect x="2" y="173" width="188" height="5" rx="2.5" fill="url(#accent)"/>
        <text x="0" y="226" fill="#b9d3df" font-size="30" font-weight="560" letter-spacing=".3">Project Context Navigation Engine</text>
        <text x="0" y="284" fill="#ffffff" font-size="34" font-weight="650">让 AI Agent 先看懂项目，再开始工作</text>

        <text x="0" y="340" fill="#87a7b6" font-size="19">
          当前任务 → 相关概念 → 候选文件 → 一跳依赖 → 历史任务
        </text>

        <g transform="translate(0 386)">
          <g>
            <rect width="176" height="48" rx="24" fill="#0f2b3c" stroke="#55d9df" stroke-opacity=".42"/>
            <text x="22" y="31" fill="#dffcff" font-size="17" font-weight="700">L1 · 物理图</text>
          </g>
          <g transform="translate(194 0)">
            <rect width="176" height="48" rx="24" fill="#122a43" stroke="#6f9aff" stroke-opacity=".45"/>
            <text x="22" y="31" fill="#e6eeff" font-size="17" font-weight="700">L2 · 语义图</text>
          </g>
          <g transform="translate(388 0)">
            <rect width="176" height="48" rx="24" fill="#1a2940" stroke="#a48cff" stroke-opacity=".42"/>
            <text x="22" y="31" fill="#f0eaff" font-size="17" font-weight="700">L3 · 任务图</text>
          </g>
        </g>

        <text x="0" y="493" fill="#668796" font-size="15" letter-spacing=".4">LOCAL-FIRST · REPLAYABLE · AGENT-NEUTRAL</text>
      </g>

      <g transform="translate(920 68)" filter="url(#shadow)">
        <rect x="0" y="0" width="586" height="504" rx="32" fill="#0b2031" fill-opacity=".67" stroke="#8bd9e7" stroke-opacity=".15"/>

        <g transform="translate(42 38)">
          <rect width="502" height="112" rx="22" fill="url(#card)" stroke="#b28eff" stroke-opacity=".27"/>
          <rect x="22" y="21" width="52" height="28" rx="14" fill="#8b70e8" fill-opacity=".20"/>
          <text x="37" y="41" fill="#cfbfff" font-size="14" font-weight="800">L3</text>
          <text x="94" y="39" fill="#f4f0ff" font-size="20" font-weight="720">Task Graph</text>
          <text x="94" y="68" fill="#9eacc0" font-size="15">目标 · 工具事件 · 修改 · 测试 · 结果</text>
          <circle cx="414" cy="56" r="21" fill="#8e72ec" fill-opacity=".17" stroke="#b99fff" stroke-opacity=".60"/>
          <path d="M405 56h18M414 47v18" stroke="#dfd3ff" stroke-width="2.3" stroke-linecap="round"/>
          <circle cx="462" cy="56" r="8" fill="#b89cff"/>
          <path d="M435 56h18" stroke="#8b73df" stroke-width="2"/>
        </g>

        <g transform="translate(42 188)">
          <rect width="502" height="112" rx="22" fill="url(#card)" stroke="#6f9cff" stroke-opacity=".28"/>
          <rect x="22" y="21" width="52" height="28" rx="14" fill="#5a83ed" fill-opacity=".21"/>
          <text x="37" y="41" fill="#b9ceff" font-size="14" font-weight="800">L2</text>
          <text x="94" y="39" fill="#edf3ff" font-size="20" font-weight="720">Semantic Graph</text>
          <text x="94" y="68" fill="#9eacc0" font-size="15">概念 · 关系 · 文档 · 配置 · 人工校正</text>
          <circle cx="410" cy="42" r="9" fill="#6f9cff"/>
          <circle cx="454" cy="67" r="9" fill="#5ccbd9"/>
          <circle cx="406" cy="79" r="7" fill="#9d8cff"/>
          <path d="M417 47l29 16M412 51l-4 20M415 76l31-7" stroke="#81a8e9" stroke-opacity=".82" stroke-width="2"/>
        </g>

        <g transform="translate(42 338)">
          <rect width="502" height="112" rx="22" fill="url(#card)" stroke="#4cddd5" stroke-opacity=".28"/>
          <rect x="22" y="21" width="52" height="28" rx="14" fill="#2dbeb5" fill-opacity=".20"/>
          <text x="37" y="41" fill="#baf8f3" font-size="14" font-weight="800">L1</text>
          <text x="94" y="39" fill="#ecfffd" font-size="20" font-weight="720">Physical Graph</text>
          <text x="94" y="68" fill="#9eacc0" font-size="15">文件 · 导入 · 引用 · 测试 · 内部资源</text>
          <path d="M394 34h58a10 10 0 0 1 10 10v38a10 10 0 0 1-10 10h-58a10 10 0 0 1-10-10V44a10 10 0 0 1 10-10Z" fill="#2fc8c0" fill-opacity=".11" stroke="#67e4dc" stroke-opacity=".66"/>
          <path d="M400 49h45M400 62h36M400 75h26" stroke="#baf7f1" stroke-width="2.2" stroke-linecap="round"/>
        </g>

        <path d="M293 150v38M293 300v38" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity=".75"/>
        <path d="M285 178l8 10 8-10M285 328l8 10 8-10" fill="none" stroke="#63d9dd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        <g transform="translate(85 466)">
          <circle cx="10" cy="10" r="5" fill="#4de3d4" filter="url(#softGlow)"/>
          <text x="26" y="15" fill="#91b3c0" font-size="14" font-weight="650">DeepSeek Harness</text>
          <circle cx="185" cy="10" r="5" fill="#6f9cff"/>
          <text x="201" y="15" fill="#91b3c0" font-size="14" font-weight="650">Codex</text>
          <circle cx="294" cy="10" r="5" fill="#c08d72"/>
          <text x="310" y="15" fill="#91b3c0" font-size="14" font-weight="650">Claude Code</text>
        </g>
      </g>
    </g>
  </g>
</svg>
